<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Worker Login – LMLinga</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .auth-page { min-height: 100vh; height: 100vh; }
    .auth-card { min-height: unset; max-height: 520px; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logos-row">
      </div>
      <h1>LOGIN TO YOUR ACCOUNT</h1>
      <p>Welcome back! Enter your details to log in to your account</p>
    </div>
    <form id="loginForm" onsubmit="handleStaffLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginName">Full Name</label>
        <input type="text" class="form-control" id="loginName" placeholder="e.g. Maria Santos" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div style="position:relative;">
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required style="padding-right:44px;">
          <button type="button" onclick="togglePassword('loginPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1rem;cursor:pointer;color:var(--gray);">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="display:block;margin:18px auto 0 auto;width:220px;">Login</button>
    </form>
    <div class="auth-link">
      Don't have an account? <a href="staff-register.html">Register here</a>
    </div>
    <div class="auth-link" style="margin-top:10px;">
      <a href="staff-landing.html">← Back to Health Worker Portal</a>
    </div>
    <div class="auth-link" style="margin-top:6px;">
      <a href="index.html">← Main Portal</a>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/app.js"></script>
<script>
  function handleStaffLogin(e) {
    e.preventDefault();
    const name = document.getElementById('loginName')?.value.trim() || '';
    if (name) sessionStorage.setItem('userName', name);
    sessionStorage.setItem('userType', 'staff');
    sessionStorage.setItem('loggedIn', 'true');
    showToast('Login successful! Redirecting...', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
  }
</script>
</body>
</html>
