<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Worker Registration – LMLinga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card" style="max-width:500px;">

    <div class="auth-logo">
      <h1>CREATE AN ACCOUNT</h1>
    </div>

    <form id="registerForm" onsubmit="handleStaffRegister(event)">

      <div class="form-row cols-3">
        <div class="form-group">
          <label class="form-label" for="firstName">First Name *</label>
          <input type="text" class="form-control" id="firstName" placeholder="e.g. Maria" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="middleName">Middle Name</label>
          <input type="text" class="form-control" id="middleName" placeholder="Dela">
        </div>
        <div class="form-group">
          <label class="form-label" for="lastName">Last Name *</label>
          <input type="text" class="form-control" id="lastName" placeholder="e.g. Santos" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regRole">Role *</label>
        <select class="form-control" id="regRole" required>
          <option value="" disabled selected>Select your role</option>
          <option value="BHW">Barangay Health Worker (BHW)</option>
          <option value="BNS">Barangay Nutrition Scholar (BNS)</option>
          <option value="BSPO">Barangay Service Point Officer (BSPO)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password *</label>
        <div style="position:relative;">
          <input type="password" class="form-control" id="regPassword" placeholder="Create a password (min. 6 characters)" required style="padding-right:44px;">
          <button type="button" onclick="togglePassword('regPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1rem;cursor:pointer;color:var(--gray);">👁️</button>
        </div>
      </div>


      <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:8px;">
         Register
      </button>

    </form>

    <div class="auth-link">
      Already have an account? <a href="staff-login.html">Login</a>
    </div>
    <div class="auth-link" style="margin-top:10px;">
      <a href="staff-landing.html">← Back to Health Worker Portal</a>
    </div>
    <div class="auth-link" style="margin-top:6px;">
      <a href="index.html">← Main Portal</a>
    </div>

  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script>
  function handleStaffRegister(e) {
    e.preventDefault();

    const firstName = document.getElementById('firstName').value.trim();
    const lastName  = document.getElementById('lastName').value.trim();
    const role      = document.getElementById('regRole').value;
    const password  = document.getElementById('regPassword').value;
    const confirm   = document.getElementById('confirmPassword').value;

    if (!firstName || !lastName || !role || !password) {
      showToast('Please fill in all required fields.', 'error');
      return;
    }
    if (password.length < 6) {
      showToast('Password must be at least 6 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      showToast('Passwords do not match.', 'error');
      return;
    }

    const fullName = `${firstName} ${lastName}`;
    sessionStorage.setItem('userName', fullName);
    sessionStorage.setItem('userRole', role);
    sessionStorage.setItem('userType', 'staff');
    sessionStorage.setItem('loggedIn', 'true');

    showToast('Account created! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1000);
  }
</script>
</body>
</html>
