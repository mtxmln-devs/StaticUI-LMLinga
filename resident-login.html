<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LMLinga</title>
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ============================================================
       BASE RESET
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      color: #0B3D0B;
    }

    /* ============================================================
       MAIN CONTAINER - Two Column Split
       ============================================================ */
    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* ============================================================
       LEFT PANEL - Login Form
       ============================================================ */
    .left-panel {
      width: 50%;
      background-color: #DFF5E5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 60px;
      position: relative;
    }

    /* Close Icon */
    .close-icon {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.2s ease;
    }

    .close-icon:hover {
      background-color: rgba(11, 61, 11, 0.1);
    }

    .close-icon svg {
      width: 18px;
      height: 18px;
      stroke: #0B3D0B;
      stroke-width: 2;
    }

    /* Login Content Wrapper */
    .login-content {
      width: 100%;
      max-width: 400px;
    }

    /* Title */
    .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0B3D0B;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Subtitle */
    .login-subtitle {
      font-size: 0.9rem;
      font-weight: 400;
      color: #3DA653;
      margin-bottom: 32px;
      text-align: center;
      line-height: 1.5;
    }

    /* ============================================================
       INPUT FIELDS
       ============================================================ */
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #3DA653;
      pointer-events: none;
    }

    .input-field {
      width: 100%;
      padding: 14px 14px 14px 44px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: #0B3D0B;
      background-color: #ffffff;
      border: 2px solid #BBF7D0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field::placeholder {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .input-field:focus {
      border-color: #22C55E;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    /* ============================================================
       FORGOT PASSWORD
       ============================================================ */
    .forgot-password {
      text-align: right;
      margin-bottom: 24px;
    }

    .forgot-password a {
      font-size: 0.8rem;
      color: #3DA653;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .forgot-password a:hover {
      color: #0B3D0B;
      text-decoration: underline;
    }

    /* ============================================================
       LOGIN BUTTON
       ============================================================ */
    .login-button {
      width: 100%;
      padding: 14px 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: #22C55E;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease;
      margin-bottom: 24px;
    }

    .login-button:hover {
      background-color: #3DA653;
      transform: translateY(-2px);
    }

    .login-button:active {
      transform: translateY(0);
    }

    /* ============================================================
       REGISTER LINK
       ============================================================ */
    .register-text {
      text-align: center;
      font-size: 0.85rem;
      color: #3DA653;
    }

    .register-text a {
      color: #22C55E;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .register-text a:hover {
      color: #0B3D0B;
      text-decoration: underline;
    }

    /* ============================================================
       RIGHT PANEL - Info / Branding
       ============================================================ */
    .right-panel {
      width: 50%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 60px;
    }

    /* Logo Image */
    .brand-logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
    }

    /* Brand Text */
    .brand-text {
      font-size: 1rem;
      font-weight: 400;
      color: #0B3D0B;
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .brand-text strong {
      font-weight: 700;
    }

    /* AI Chatbot Image */
    .ai-image {
      width: 180px;
      height: auto;
      margin-bottom: 32px;
    }

    /* ============================================================
       LANGUAGE LIST
       ============================================================ */
    .language-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .language-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #0B3D0B;
      font-weight: 500;
    }

    .chat-bubble-icon {
      width: 18px;
      height: 18px;
      color: #22C55E;
      flex-shrink: 0;
    }

    /* ============================================================
       RESPONSIVE - Mobile
       ============================================================ */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .left-panel {
        width: 100%;
        padding: 40px 24px;
        order: 1;
      }

      .right-panel {
        width: 100%;
        padding: 32px 24px;
        order: 2;
      }

      .login-title {
        font-size: 1.4rem;
      }

      .brand-logo {
        width: 100px;
      }

      .ai-image {
        width: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       MAIN CONTAINER
       ============================================================ -->
  <div class="login-container">

    <!-- ============================================================
         LEFT PANEL - Login Form
         ============================================================ -->
    <div class="left-panel">

      <!-- Close Icon -->
      <div class="close-icon" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>

      <div class="login-content">

        <!-- Title -->
        <h1 class="login-title">LOGIN TO YOUR ACCOUNT</h1>

        <!-- Subtitle -->
        <p class="login-subtitle">Welcome back! Enter your details to log in to your account</p>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">

          <!-- Household No. Input -->
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <input 
              type="text" 
              class="input-field" 
              id="householdNo" 
              placeholder="Household No." 
              required
            >
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              class="input-field" 
              id="password" 
              placeholder="Password" 
              required
            >
          </div>

          <!-- Forgot Password -->
          <div class="forgot-password">
            <a href="#">Forgot Password?</a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="login-button">Login</button>

        </form>

        <!-- Register Link -->
        <p class="register-text">
          Don't have an account? <a href="resident-register.html">Register</a>
        </p>

      </div>
    </div>

    <!-- ============================================================
         RIGHT PANEL - Info / Branding
         ============================================================ -->
    <div class="right-panel">

      <!-- Logo Image -->
      <img src="img/logo.png" alt="LMLinga Logo" class="brand-logo">

      <!-- Brand Text -->
      <p class="brand-text">
        A multilingual <strong>chatbot</strong> for health information and education only.
      </p>

      <!-- AI Chatbot Image -->
      <img src="img/ai.png" alt="AI Chatbot" class="ai-image">

      <!-- Language List -->
      <ul class="language-list">
        <li class="language-item">
          <svg class="chat-bubble-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          English
        </li>
        <li class="language-item">
          <svg class="chat-bubble-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Tagalog
        </li>
        <li class="language-item">
          <svg class="chat-bubble-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          Bikol Iriga
        </li>
      </ul>

    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Minimal JavaScript -->
  <script>
    /**
     * Handle Login Form Submission
     * No backend - just UI demonstration
     */
    function handleLogin(event) {
      event.preventDefault();
      
      const householdNo = document.getElementById('householdNo').value.trim();
      const password = document.getElementById('password').value;

      // Simple validation
      if (!householdNo || !password) {
        showToast('Please fill in all fields.', 'error');
        return;
      }

// Simulate successful login and redirect directly
      showToast('Login successful! Redirecting...', 'success');
      
      // Set session storage for resident login
      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('userType', 'resident');
      sessionStorage.setItem('userRole', 'Resident');
      sessionStorage.setItem('userName', householdNo);
      
      // Direct navigation to chatbot.html
      window.location.href = 'chatbot.html';
    }

    /**
     * Simple Toast Notification
     */
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 14px 24px;
        border-radius: 12px;
        font-family: 'Poppins', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: white;
        background: ${type === 'success' ? '#22C55E' : '#EF4444'};
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        z-index: 9999;
        animation: slideIn 0.3s ease;
      `;
      
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>

</body>
</html>
