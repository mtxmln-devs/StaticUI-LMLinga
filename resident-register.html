<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Registration – LMLinga</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; }

    /* ============================================================
       NAVBAR
       ============================================================ */
    .landing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      background: var(--white);
      border-bottom: 1px solid var(--highlight);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      height: 70px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: contain;
    }

    .nav-brand-text .name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary);
    }

    /* ============================================================
       MAIN CONTAINER - Two Column Layout
       ============================================================ */
    .register-container {
      display: flex;
      height: calc(100vh - 70px);
      width: 100%;
    }

    /* ============================================================
       LEFT PANEL - Branding
       ============================================================ */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--white);
      padding: 40px;
      gap: 20px;
    }

    .branding-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .branding-logo img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: contain;
    }

    .branding-logo .brand-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--dark-text);
    }

    .chatbot-image {
      width: 320px;
      height: 320px;
      max-width: 80%;
      object-fit: contain;
      border-radius: var(--radius-lg);
    }

    .ai-caption {
      font-size: 1rem;
      color: var(--gray-dark);
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .lang-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-btn {
      padding: 10px 28px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--primary);
      background: var(--white);
      color: var(--primary);
      font-size: 0.9rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      min-width: 100px;
    }

    .lang-btn:hover {
      background: var(--primary);
      color: var(--white);
    }

    /* ============================================================
       RIGHT PANEL - Registration Form
       ============================================================ */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 40px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--white);
      color: var(--gray);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .close-btn:hover {
      background: var(--highlight);
      color: var(--dark-text);
    }

    /* Form Card */
    .form-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px 40px;
      width: 100%;
      max-width: 460px;
    }

    /* Form Header */
    .form-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .form-header .user-icon {
      font-size: 1.3rem;
      color: var(--primary);
    }

    .form-header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dark-text);
      letter-spacing: 0.5px;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dark-text);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--highlight);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      color: var(--dark-text);
      background: var(--gray-light);
      transition: var(--transition);
      outline: none;
      font-family: 'Poppins', sans-serif;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
      background: var(--white);
    }

    .form-input::placeholder {
      color: var(--gray);
    }

    /* Password Toggle */
    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: var(--gray);
      padding: 0;
    }

    .toggle-password:hover {
      color: var(--dark-text);
    }

    /* Register Button */
    .btn-register {
      display: block;
      width: fit-content;
      margin: 24px auto 0;
      padding: 14px 48px;
      border-radius: 50px;
      background: var(--primary);
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Poppins', sans-serif;
    }

    .btn-register:hover {
      background: var(--secondary);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
    }

    /* Login Link */
    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--gray-dark);
    }

    .login-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* ============================================================
       RESPONSIVE - Tablet
       ============================================================ */
    @media (max-width: 1024px) {
      .left-panel,
      .right-panel {
        padding: 30px 24px;
      }

      .chatbot-image {
        width: 260px;
        height: 260px;
      }

      .form-card {
        padding: 28px 32px;
      }
    }

    /* ============================================================
       RESPONSIVE - Mobile
       ============================================================ */
    @media (max-width: 768px) {
      html, body {
        overflow: auto;
      }

      .landing-nav {
        padding: 14px 20px;
        height: auto;
      }

      .register-container {
        flex-direction: column;
        height: auto;
        min-height: calc(100vh - 60px);
      }

      /* Registration form appears first on mobile */
      .right-panel {
        order: 1;
        padding: 30px 20px;
      }

      .left-panel {
        order: 2;
        padding: 30px 20px;
      }

      .chatbot-image {
        width: 220px;
        height: 220px;
      }

      .ai-caption {
        font-size: 0.9rem;
      }

      .form-card {
        padding: 28px 24px;
        max-width: 100%;
      }

      .form-header h1 {
        font-size: 1.15rem;
      }

      .lang-buttons {
        gap: 12px;
      }

      .lang-btn {
        padding: 8px 20px;
        font-size: 0.85rem;
      }

      .btn-register {
        padding: 12px 40px;
        font-size: 0.95rem;
      }
    }
  </style>

</head>
<body>

  <!-- NAVBAR -->
  <nav class="landing-nav">
    <div class="nav-brand">
      <img src="img/logo.png" alt="LMLinga Logo">
      <div class="nav-brand-text">
        <div class="name">LMLinga</div>
      </div>
    </div>
  </nav>

  <!-- MAIN REGISTER CONTAINER -->
  <div class="register-container">

    <!-- LEFT PANEL - Branding Section -->
    <div class="left-panel">



      <!-- Chatbot AI Image -->
      <img src="img/ai.png" alt="AI Health Assistant" class="chatbot-image">

      <!-- Caption -->
      <p class="ai-caption">A multilingual chatbot for health information and education only.</p>

      <!-- Language Selection Buttons -->
      <div class="lang-buttons">
        <button type="button" class="lang-btn">English</button>
        <button type="button" class="lang-btn">Tagalog</button>
        <button type="button" class="lang-btn">Bikol-Iriga</button>
      </div>

    </div>

    <!-- RIGHT PANEL - Registration Form -->
    <div class="right-panel">

      <!-- Close Button -->
      <button type="button" class="close-btn" onclick="window.location.href='index.html'" title="Close">&#10005;</button>

      <!-- Registration Form Card -->
      <div class="form-card">

        <!-- Form Title -->
        <div class="form-header">
          <span class="user-icon">&#128100;</span>
          <h1>CREATE AN ACCOUNT</h1>
        </div>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleResidentRegister(event)">

          <!-- Input Field: First Name -->
          <div class="form-group">
            <label class="form-label" for="firstName">First Name</label>
            <input type="text" class="form-input" id="firstName" placeholder="Enter your first name" required>
          </div>

          <!-- Input Field: Middle Name -->
          <div class="form-group">
            <label class="form-label" for="middleName">Middle Name</label>
            <input type="text" class="form-input" id="middleName" placeholder="Enter your middle name">
          </div>

          <!-- Input Field: Last Name -->
          <div class="form-group">
            <label class="form-label" for="lastName">Last Name</label>
            <input type="text" class="form-input" id="lastName" placeholder="Enter your last name" required>
          </div>

          <!-- Input Field: Household No. -->
          <div class="form-group">
            <label class="form-label" for="householdNo">Household No.</label>
            <input type="text" class="form-input" id="householdNo" placeholder="Enter household number">
          </div>

          <!-- Input Field: Password -->
          <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input" id="regPassword" placeholder="Minimum 6 characters" required>
              <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">&#128065;</button>
            </div>
          </div>

          <!-- Register Button -->
          <button type="submit" class="btn-register">Register</button>

        </form>

        <!-- Login Link -->
        <div class="login-link">
          Already have an account? <a href="resident-login.html">Login</a>
        </div>

      </div>
    </div>
  </div>


  <div id="toast-container"></div>
  <script src="js/app.js"></script>
  <script>
    /* Toggle password visibility */
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '&#128065;&#65039;';
      } else {
        input.type = 'password';
        btn.innerHTML = '&#128065;';
      }
    }

    function handleResidentRegister(e) {

      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const password  = document.getElementById('regPassword').value;

      if (!firstName || !lastName || !password) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }


      const fullName = firstName + ' ' + lastName;

      sessionStorage.setItem('userName', fullName);
      sessionStorage.setItem('userRole', 'Resident');
      sessionStorage.setItem('userType', 'resident');
      sessionStorage.setItem('loggedIn', 'true');

showToast('Account created! Redirecting...', 'success');
      // Direct navigation to chatbot.html
      window.location.href = 'chatbot.html';


    }
  </script>
</body>
</html>
